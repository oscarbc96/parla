# Keeps one Release PR open (release-please) and, when it merges, tags the
# commit and creates a draft GitHub Release. A tag or Release made with
# GITHUB_TOKEN triggers no other workflow, so the dispatch job starts
# release-build.yml on the tag (build, sign, publish; configure the `release`
# environment to admit only tags `v*`).
name: Release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write # its `autorelease:` labels
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - name: Release PR
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ github.token }}

  dispatch:
    name: dispatch
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Dispatch the release build on the tag
        run: gh workflow run release-build.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
