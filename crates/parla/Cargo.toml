[package]
name = "parla"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "parla"

[lib]
path = "src/lib.rs"

[[bin]]
name = "parla"
path = "src/main.rs"

[features]
# Perf harness: the synthetic `perf` workspace, counters,
# the scenario driver and `perf_check`. Off in normal builds.
fixture = ["domain/test-support", "dep:toml"]
# Frame-time percentiles in the perf reports (`cargo run --release -p parla
# --features frame-profiler -- --perf-scenario scroll`). Adds about 18 MB of
# histograms, so idle memory is measured without it.
frame-profiler = ["fixture", "gpui/profiler"]

[[bin]]
name = "perf_check"
path = "src/bin/perf_check.rs"
required-features = ["fixture"]

# `call.native` measurement; skipped unless PARLA_PERF_NATIVE_CALL=1.
[[example]]
name = "perf_call_native"
path = "examples/perf_call_native.rs"
required-features = ["fixture"]

[dependencies]
anyhow.workspace = true
log.workspace = true
auto-launch = "=0.6.0"
gpui.workspace = true
gpui_platform.workspace = true
settings.path = "../settings"
mcp = { path = "../mcp" }
uuid = { version = "1", features = ["v4"] }
write_confirm = { path = "../write_confirm" }
calls = { path = "../calls" }
components.path = "../components"
themes.path = "../themes"
i18n = { path = "../i18n", features = ["gpui"] }
futures.workspace = true
domain.path = "../domain"
store.path = "../store"
store_sqlite.path = "../store_sqlite"
tokio.workspace = true
tokio-util = "0.7"
slack.path = "../providers/slack/provider"
slack_auth.path = "../providers/slack/auth"
slack_redact.path = "../providers/slack/redact_rules"
redact.path = "../redact"
jiff.workspace = true
zeroize.workspace = true
reqwest.workspace = true
semver.workspace = true
url.workspace = true
minisign-verify.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_lenient.workspace = true
tempfile.workspace = true
toml = { workspace = true, optional = true }

[dev-dependencies]
wiremock.workspace = true
minisign = "0.10"
domain = { path = "../domain", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
store = { path = "../store", features = ["test-support"] }
store_sqlite = { path = "../store_sqlite", features = ["test-support"] }
toml.workspace = true
rmcp = { version = "=3.10.0", default-features = false, features = ["client", "transport-async-rw"] }
parla = { path = ".", features = ["fixture"] }
redact = { path = "../redact" }
slack_api = { path = "../providers/slack/api" }
libc = "0.2"
regex.workspace = true
png = "0.18"
url.workspace = true
# gpui-fast uses resvg 0.46.0, so this 0.48.1 builds a second copy; renders the app icons (mise run assets:icons).
resvg = { version = "0.48.1", default-features = false }
tray-icon = "0.26"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# The menu-bar icon; Linux has no status item yet, so no GTK dependency.
tray-icon = { version = "0.26", default-features = false }
png = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
# setxattr for the quarantine mark on downloads (already in the tree).
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSDockTile", "NSResponder", "NSScreen", "NSSound", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSData", "NSNotification", "NSOperation", "NSString", "block2"] }
# The block for the accessibility display change observer and the idle
# lock's sleep and wake observer (already in the tree).
block2 = "0.6"

[package.metadata.packager]
product-name = "Parla"
identifier = "com.justparla.parla"
formats = ["app"]
icons = ["../../assets/icons/app/icon-32.png", "../../assets/icons/app/icon-128.png", "../../assets/icons/app/icon-256.png", "../../assets/icons/app/icon-512.png"]
binaries = [{ path = "parla", main = true }]
# One <locale>.lproj per locale in i18n/locales.toml (checked by tests/bundle.rs).
resources = [
  { src = "macos/en.lproj", target = "en.lproj" },
  { src = "macos/es.lproj", target = "es.lproj" },
  { src = "macos/ca.lproj", target = "ca.lproj" },
  { src = "../../target/release-assets/NOTICE", target = "NOTICE" },
]

[package.metadata.packager.macos]
minimum-system-version = "14.0"
info-plist-path = "macos/Info.plist"
