[package]
name = "components"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
# A scripted `GifSource` for tests and visual scenarios.
test-support = []

[dependencies]
domain.path = "../domain"
zeroize.workspace = true
themes.path = "../themes"
gpui.workspace = true
gpui_base.workspace = true
jiff.workspace = true
emojis.workspace = true
settings.path = "../settings"
write_confirm = { path = "../write_confirm" }
store.path = "../store"
i18n = { path = "../i18n", features = ["gpui"] }
lru = "0.19.0"
unicode-segmentation = "1.13.3"
futures.workspace = true
dirs.workspace = true
uuid = { version = "1", features = ["v4"] }
image = { workspace = true, features = ["jpeg", "gif", "webp"] }

[dev-dependencies]
tempfile.workspace = true
# The GIF picker tests drive the scripted source.
components = { path = ".", features = ["test-support"] }
# The MCP prompt tests build requests through `mcp`'s adapter.
mcp = { path = "../mcp" }
domain = { path = "../domain", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
insta.workspace = true

# Clip playback on macOS: AVFoundation through the OS decoder.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVAsset", "AVAsynchronousKeyValueLoading", "AVMediaFormat", "objc2-core-media", "objc2-core-video"] }
objc2-core-foundation = "0.3.2"
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVPixelBufferPool"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSURL", "NSString", "NSDictionary", "NSValue", "NSObject", "NSError", "NSArray"] }
