[package]
name = "plugin_host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

# Exact pins: wasmtime 48 is the LTS line.
# No `parallel-compilation` feature (M8 A1 spike: it saves 0.17 s per
# compile but costs +45 MB and leaves 12 threads running). `cranelift` is
# needed: installed `.wasm` files are compiled on this machine.
[dependencies]
domain = { path = "../domain" }
flate2 = "1"
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
settings = { path = "../settings", default-features = false }
store = { path = "../store" }
# `HostCallKind` lists every host call family, so a test cannot miss one.
strum = { version = "0.28", features = ["derive"] }
sha2 = "0.11"
tar = { version = "0.4.46", default-features = false }
parla_plugin_api = { path = "../parla_plugin_api" }
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
toml.workspace = true
url.workspace = true
wait-timeout = "0.2"
wasmparser = "0.254"
wasmtime = { version = "=48.0.10", default-features = false, features = ["runtime", "std", "component-model", "async", "cranelift"] }
wasmtime-wasi = { version = "=48.0.10", default-features = false, features = ["p2"] }
wasmtime-wasi-io = { version = "=48.0.10", default-features = false, features = ["std"] }

[dev-dependencies]
futures.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
wasm-encoder = "0.254"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
