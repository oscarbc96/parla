[package]
name = "mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

# The `parla mcp` shim as its own binary: cargo builds it before the integration
# tests and hands them its path (`CARGO_BIN_EXE_parla_shim`), so the shim tests
# never run cargo themselves (concurrent runs relinked the file under them).
[[bin]]
name = "parla_shim"
path = "src/bin/parla_shim.rs"

[features]
test-support = ["domain/test-support", "store/test-support", "write_confirm/test-support"]

[dependencies]
domain = { path = "../domain" }
store = { path = "../store" }
settings = { path = "../settings", default-features = false }
write_confirm = { path = "../write_confirm" }
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "schemars", "transport-async-rw", "transport-io", "base64"] }
base64 = "0.23"
futures.workspace = true
governor.workspace = true
jiff.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std", "net", "time", "process", "sync", "rt"] }
tracing = "0.1"
tokio-util = "0.7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
interprocess = { version = "=2.4.9", features = ["tokio"] }
widestring = "1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes"] }

[dev-dependencies]
domain = { path = "../domain", features = ["test-support"] }
store = { path = "../store", features = ["test-support"] }
mcp = { path = ".", features = ["test-support"] }
rmcp = { version = "=3.10.0", default-features = false, features = ["server", "schemars", "transport-async-rw", "transport-io", "client"] }
tempfile.workspace = true
insta.workspace = true
