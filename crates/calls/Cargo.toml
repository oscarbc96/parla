[package]
name = "calls"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
domain = { path = "../domain" }
serde.workspace = true
serde_json.workspace = true
settings = { path = "../settings", default-features = false }
thiserror.workspace = true
url.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
futures.workspace = true
wry.workspace = true
cookie = "0.18"
zeroize.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "rt", "net", "sync", "time", "macros"] }
tracing = "0.1"
cpal.workspace = true
sonora.workspace = true
opus.workspace = true
chime_signal = { path = "../chime_signal" }
str0m.workspace = true
tokio-tungstenite.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSObject", "NSString", "NSKeyValueObserving", "NSDictionary"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "block2", "objc2-app-kit"] }
objc2-core-audio = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[dev-dependencies]
domain = { path = "../domain", features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
