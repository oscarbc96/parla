scenarios = ["timeline_*", "reactions", "message_actions_menu", "long_names", "unresolved_names", "thread_open", "dm_header", "dm_intro", "people_directory*"]

[[map]]
glob = "crates/components/src/{thread_panel,thread_summary,threads_view}.rs"
