# Which visual scenarios a source file can change.
#
# `glob` matches a changed path (Bun glob syntax); `scenarios` lists scenario
# names, where `*` matches any run of characters. Scenarios whose baseline PNG
# changed are always included. A UI source file (components, themes, parla views)
# that matches no entry here selects every scenario, so a missing entry costs
# time, never coverage. `--scenarios a,b` overrides all of this.

[[map]]
glob = "crates/components/src/composer.rs"
scenarios = ["composer_*", "empty_conversation"]

[[map]]
glob = "crates/domain/src/typing.rs"
scenarios = ["composer_typing"]

[[map]]
glob = "crates/components/src/{format_toolbar,slash_menu,send_later,datetime_picker,completion,emoji_picker}.rs"
scenarios = ["composer_*", "emoji_picker_open"]

[[map]]
glob = "crates/components/src/{gif_picker,gif_picker/**.rs}"
