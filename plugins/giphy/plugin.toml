id = "giphy"
name = "GIF search: Giphy"
namespace = "giphy"
version = "0.1.0"
api = "0.1"
description = "Search and share GIFs from Giphy in the media picker."
license = "Apache-2.0 OR MIT"
categories = ["media"]
activation = ["media:giphy"]

[capabilities]
network = [
  "api.giphy.com",
  "media.giphy.com",
  "media0.giphy.com",
  "media1.giphy.com",
  "media2.giphy.com",
  "media3.giphy.com",
  "media4.giphy.com",
  "i.giphy.com",
]

[[media_providers]]
id = "giphy"
title = "GIPHY"
kinds = ["gif"]

[[settings]]
key = "api_key"
type = "secret"
title = "API key"
description = "Create a Giphy API key in your developers.giphy.com dashboard and paste it here."
